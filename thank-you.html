<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --cream:#F5F0E8;
  --dark:#1A1714;
  --dark2:#2C2419;
  --accent:#8B7355;
  --light-accent:#C4A882;
  --muted:#9A9088;
  --white:#FDFBF7;
}
html{height:100%}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--dark);
  color:var(--white);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  position:relative;
}

/* Background grain */
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity:0.5;
  pointer-events:none;
  z-index:0;
}

/* Radial glow behind content */
body::after{
  content:'';
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:800px;height:800px;
  background:radial-gradient(circle,rgba(196,168,130,0.06) 0%,transparent 70%);
  pointer-events:none;
  z-index:0;
}

/* Decorative lines */
.deco-lines{
  position:fixed;top:0;right:12%;height:100%;
  display:flex;gap:60px;z-index:0;pointer-events:none;
}
.deco-lines span{
  display:block;width:1px;height:100%;
  background:linear-gradient(to bottom,transparent,rgba(196,168,130,0.06) 30%,rgba(196,168,130,0.06) 70%,transparent);
}

/* Main content */
.content{
  position:relative;z-index:1;
  text-align:center;
  padding:2rem;
  max-width:620px;
}

/* Checkmark animation */
.checkmark-wrap{
  width:90px;height:90px;
  margin:0 auto 2.5rem;
  position:relative;
}
.checkmark-circle{
  width:90px;height:90px;
  border-radius:50%;
  border:2px solid var(--light-accent);
  display:flex;align-items:center;justify-content:center;
  opacity:0;
  transform:scale(0.5);
  animation:circleIn .7s cubic-bezier(.25,.46,.45,.94) .3s forwards;
}
.checkmark-circle svg{
  width:36px;height:36px;
  stroke:var(--light-accent);
  stroke-width:2.5;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.checkmark-circle svg path{
  stroke-dasharray:30;
  stroke-dashoffset:30;
  animation:checkDraw .5s cubic-bezier(.25,.46,.45,.94) .9s forwards;
}
@keyframes circleIn{
  to{opacity:1;transform:scale(1)}
}
@keyframes checkDraw{
  to{stroke-dashoffset:0}
}

/* Top tag */
.tag{
  font-size:.7rem;
  letter-spacing:.25em;
  text-transform:uppercase;
  color:var(--light-accent);
  margin-bottom:1.2rem;
  opacity:0;
  animation:fadeUp .8s cubic-bezier(.25,.46,.45,.94) 1.1s forwards;
}

/* Heading */
h1{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(2.2rem,5vw,3.5rem);
  font-weight:300;
  line-height:1.15;
  color:var(--white);
  margin-bottom:1.2rem;
  opacity:0;
  animation:fadeUp .8s cubic-bezier(.25,.46,.45,.94) 1.3s forwards;
}
h1 em{
  font-style:italic;
  color:var(--light-accent);
}

/* Subtext */
.subtext{
  font-size:1rem;
  font-weight:300;
  line-height:1.8;
  color:rgba(255,255,255,.5);
  margin-bottom:2.5rem;
  opacity:0;
  animation:fadeUp .8s cubic-bezier(.25,.46,.45,.94) 1.5s forwards;
}

/* Divider */
.divider{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:.8rem;
  margin-bottom:2.5rem;
  opacity:0;
  animation:fadeUp .8s cubic-bezier(.25,.46,.45,.94) 1.7s forwards;
}
.divider span{
  display:block;width:60px;height:1px;
  background:var(--light-accent);
  opacity:.4;
}
.divider-dot{
  width:6px;height:6px;
  border-radius:50%;
  background:var(--light-accent);
}

/* Contact info */
.contact-row{
  display:flex;
  justify-content:center;
  gap:3rem;
  flex-wrap:wrap;
  margin-bottom:3rem;
  opacity:0;
  animation:fadeUp .8s cubic-bezier(.25,.46,.45,.94) 1.9s forwards;
}
.contact-item{
  text-align:center;
}
.contact-label{
  font-size:.6rem;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:rgba(255,255,255,.35);
  margin-bottom:.4rem;
}
.contact-val{
  font-family:'Cormorant Garamond',serif;
  font-size:1.15rem;
  color:var(--white);
  text-decoration:none;
  transition:color .5s;
  cursor:pointer;
}
.contact-val:hover{color:var(--light-accent)}

/* Back button */
.back-btn{
  display:inline-flex;
  align-items:center;
  gap:.8rem;
  padding:.9rem 2rem;
  border:1px solid rgba(196,168,130,.4);
  color:var(--light-accent);
  font-family:'DM Sans',sans-serif;
  font-size:.72rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  text-decoration:none;
  cursor:pointer;
  transition:all .6s cubic-bezier(.25,.46,.45,.94);
  opacity:0;
  animation:fadeUp .8s cubic-bezier(.25,.46,.45,.94) 2.1s forwards;
}
.back-btn:hover{
  background:var(--light-accent);
  color:var(--dark);
  border-color:var(--light-accent);
}
.back-btn svg{
  width:14px;
  transition:transform .5s;
}
.back-btn:hover svg{transform:translateX(-4px)}

/* Footer brand */
.footer-brand{
  position:fixed;
  bottom:2rem;
  left:50%;
  transform:translateX(-50%);
  z-index:1;
  opacity:0;
  animation:fadeUp .8s cubic-bezier(.25,.46,.45,.94) 2.3s forwards;
}
.footer-brand a{
  font-family:'Cormorant Garamond',serif;
  font-size:.9rem;
  font-weight:400;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:rgba(255,255,255,.25);
  text-decoration:none;
  transition:color .5s;
  cursor:pointer;
}
.footer-brand a:hover{color:rgba(255,255,255,.5)}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

@media(max-width:600px){
  .contact-row{gap:2rem;flex-direction:column}
  .deco-lines{display:none}
}
</style>
